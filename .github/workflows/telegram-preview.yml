name: Telegram preview

on:
  push:
    branches: [telegram-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Build with the telegram feature
    runs-on: ubuntu-latest
    container: debian:12
    timeout-minutes: 60
    steps:
      - name: GUI build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev \
            libpipewire-0.3-dev clang libclang-dev cmake perl
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked --features telegram
      - uses: actions/upload-artifact@v7
        with:
          name: zapfast-telegram-linux-x86_64
          path: target/debug/zapfast
          if-no-files-found: error
